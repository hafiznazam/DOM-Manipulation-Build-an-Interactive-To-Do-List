<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="todo-container">

        <h1>My To-Do List</h1>

        <!-- Add Task -->
        <div class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Counter -->
        <p id="taskCounter">
            0 tasks remaining
        </p>


        <!-- Filters -->
        <div class="filters">

            <button class="filter-btn active"
                    data-filter="all">
                All
            </button>

            <button class="filter-btn"
                    data-filter="active">
                Active
            </button>

            <button class="filter-btn"
                    data-filter="completed">
                Completed
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList"></ul>

    </div>


    <script src="script.js"></script>

</body>
</html>
